services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: mykytadu
      POSTGRES_PASSWORD: mykytadu-local
      POSTGRES_USER: mykytadu
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mykytadu-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mykytadu-postgres-data:
    name: mykytadu-postgres-data

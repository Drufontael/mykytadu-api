name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Docker availability
        run: docker info

      - name: Run mandatory verification gates
        run: ./gradlew check --no-daemon --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Lint OpenAPI contract
        shell: bash
        run: |
          set -o pipefail
          npx --yes @redocly/cli@2.45.0 lint docs/api/openapi.yaml 2>&1 | tee contract-report.txt

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Check whether base OpenAPI contract exists
        if: github.event_name == 'pull_request'
        id: base-openapi
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:docs/api/openapi.yaml" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI contract exists on the base branch; skipping compatibility comparison."
          fi

      - name: Check backward compatibility
        if: >
          github.event_name == 'pull_request' &&
          steps.base-openapi.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.11
        with:
          base: "origin/${{ github.base_ref }}:docs/api/openapi.yaml"
          revision: "HEAD:docs/api/openapi.yaml"
          fail-on: ERR
          allow-external-refs: false
          review: false

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: contract-report.txt
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  image:
    name: OCI image
    needs: [verify, contract, dependencies]
    if: >
      always() &&
      needs.verify.result == 'success' &&
      needs.contract.result == 'success' &&
      (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Docker availability
        run: docker info

      - name: Build OCI image after verification gates
        run: ./gradlew bootBuildImage --no-daemon --console=plain

      - name: Inspect OCI image metadata
        shell: bash
        run: |
          docker image inspect mykytadu-api:0.0.1-SNAPSHOT \
            --format 'image={{index .RepoTags 0}} id={{.Id}}'

  reports:
    name: Reports
    if: always()
    needs: [verify, contract, dependencies, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download verification reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: verification-reports
          path: reports/verification

      - name: Download contract reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: contract-reports
          path: reports/contract

      - name: Publish CI status summary
        shell: bash
        run: |
          {
            echo "## CI status summary"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Verify | ${{ needs.verify.result }} |"
            echo "| OpenAPI contract | ${{ needs.contract.result }} |"
            echo "| Dependency review | ${{ needs.dependencies.result }} |"
            echo "| OCI image | ${{ needs.image.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

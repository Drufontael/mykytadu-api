name: Agent configuration

on:
  pull_request:
    paths:
      - AGENTS.md
      - .agents/**
      - .github/workflows/agent-configuration.yml
  push:
    branches:
      - master
    paths:
      - AGENTS.md
      - .agents/**
      - .github/workflows/agent-configuration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate skills and index
        shell: pwsh
        run: .\.agents/scripts/validate-skills.ps1

name: Agent configuration

on:
  pull_request:
    paths:
      - AGENTS.md
      - .agents/**
      - .github/workflows/agent-configuration.yml
  push:
    branches:
      - master
    paths:
      - AGENTS.md
      - .agents/**
      - .github/workflows/agent-configuration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check required agent validator
        shell: pwsh
        run: |
          $validator = Join-Path $env:GITHUB_WORKSPACE ".agents/scripts/validate-skills.ps1"
          if (-not (Test-Path -LiteralPath $validator -PathType Leaf)) {
            throw "Required agent validator not found: $validator"
          }
          & $validator

spring:
  config:
    activate:
      on-profile: integration-test
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      connection-timeout: 1000

mykytadu:
  identity:
    refresh-derivation:
      active-key-id: integration-ephemeral
      key-mode: ephemeral
    jwt:
      active-key-id: integration-ephemeral
      key-mode: ephemeral
    email:
      delivery-mode: accept

spring:
  config:
    activate:
      on-profile: staging
  docker:
    compose:
      enabled: false
  datasource:
    url: ${MYKYTADU_DATABASE_URL}
    username: ${MYKYTADU_DATABASE_USERNAME}
    password: ${MYKYTADU_DATABASE_PASSWORD}

server:
  port: ${PORT:${MYKYTADU_SERVER_PORT:8081}}

mykytadu:
  identity:
    authentication:
      allowed-web-origins: ${MYKYTADU_WEB_ALLOWED_ORIGINS}
    jwt:
      issuer: ${MYKYTADU_JWT_ISSUER}
  translation:
    provider:
      url: ${MYKYTADU_TRANSLATION_PROVIDER_URL}
      api-key: ${MYKYTADU_TRANSLATION_PROVIDER_API_KEY:}
      mode: libretranslate
    quota:
      daily-characters-limit: ${MYKYTADU_TRANSLATION_DAILY_CHARACTERS_LIMIT:50000}

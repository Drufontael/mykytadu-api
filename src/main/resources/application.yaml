spring:
  application:
    name: mykytadu-api
  docker:
    compose:
      enabled: false
  flyway:
    sql-migration-separator: "-"
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: mykytadu-api
  docker:
    compose:
      enabled: false
  flyway:
    sql-migration-separator: "-"
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

mykytadu:
  identity:
    registration:
      verification-token-ttl: 24h
      delivery-retry-after: 60s
      registration-limit: 10
      registration-window: 10m
      resend-limit: 5
      resend-window: 1h
      resend-cooldown: 1m
    email:
      delivery-mode: unavailable

logging:
  structured:
    format:
      console: logstash

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics
